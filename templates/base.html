<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}废钢供应链{% endblock %} - 废钢供应链系统</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/js/app.js"></script>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <div class="brand">废钢供应链 <span class="ver" id="app-ver" title="当前运行的版本">v{{ app_version }}</span></div>
  <nav class="main-nav">
    <a href="/m" class="nav-phone-only">手机录入</a>
    <a href="/" class="{{ 'active' if active=='dashboard' }}">首页</a>
    <a href="/trips" class="{{ 'active' if active=='trips' }}">车次</a>
    <a href="/tracking" class="{{ 'active' if active=='tracking' }}">回款</a>
    <a href="/reports" class="{{ 'active' if active=='reports' }}">统计</a>

    <div class="nav-group {{ 'nav-group-active' if active=='rules' }}">
      <button type="button" class="nav-group-btn" aria-haspopup="true" aria-expanded="false">规则与算价 ▾</button>
      <div class="nav-drop">
        <a href="/rules" class="{{ 'active' if rules_sub|default('')=='hub' }}">本期总览</a>
        <a href="/rate_links" class="{{ 'active' if rules_sub|default('')=='rates' }}">费率与关系</a>
        <a href="/chain_rules" class="{{ 'active' if rules_sub|default('')=='chains' }}">链条规则</a>
      </div>
    </div>

    <div class="nav-group {{ 'nav-group-active' if active=='setup' }}">
      <button type="button" class="nav-group-btn" aria-haspopup="true" aria-expanded="false">档案与系统 ▾</button>
      <div class="nav-drop">
        <a href="/setup" class="{{ 'active' if setup_sub|default('')=='hub' }}">总览</a>
        <a href="/archives" class="{{ 'active' if setup_sub|default('')=='archives' }}">基础档案</a>
        <a href="/system" class="{{ 'active' if setup_sub|default('')=='system' }}">系统</a>
        <a href="/glossary" class="{{ 'active' if setup_sub|default('')=='glossary' }}">术语速查</a>
        <a href="/quotes" class="nav-optional {{ 'active' if setup_sub|default('')=='quotes' }}">报价单（少用）</a>
      </div>
    </div>
  </nav>
</div>
<div id="update-banner" class="update-banner" hidden></div>
<div class="container">
<div class="page-header page-header-row"><h1>{% block page_heading %}{{ self.title() }}{% endblock %}</h1><div class="page-actions">{% block header_actions %}{% endblock %}</div></div>
{% block content %}{% endblock %}
</div>
{% block extra_scripts %}{% endblock %}
</body>
</html>
